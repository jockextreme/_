function fmtDate(d, opts={month:'short', day:'numeric'}) { const date = typeof d === 'string' ? new Date(d) : d; return date.toLocaleDateString('en-US', opts); }
function fmtTime(d) { const date = typeof d === 'string' ? new Date(d) : d; return date.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }
function fmtDateTime(d) { return `${fmtDate(d)} · ${fmtTime(d)}`; }
function fmtMoney(n) { return '₱' + Number(n).toLocaleString(); }
function relTime(d) {
  const s = Math.floor((Date.now() - new Date(d).getTime())/1000);
  if (Math.abs(s) < 60) return 'just now';
  const m = Math.floor(Math.abs(s)/60), h = Math.floor(m/60), dd = Math.floor(h/24);
  return s < 0 ? (m<60?'in '+m+'m':h<24?'in '+h+'h':'in '+dd+'d') : (m<60?m+'m ago':h<24?h+'h ago':dd<7?dd+'d ago':fmtDate(d,{month:'short',day:'numeric'}));
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function startOfWeek(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isToday(d){ return sameDay(new Date(d), new Date()); }
function avatar(u, size=40){ return `<img src="${u.avatar}" alt="${esc(u.name)}" class="rounded-full object-cover shrink-0 bg-black/5" style="width:${size}px;height:${size}px" onerror="this.src='https://i.pravatar.cc/150?u=${u.id}'">`; }

function groupByDate(items, getDate, opts = {}) {
  const now = new Date();
  const today = startOfDay(now);
  const tomorrow = addDays(today, 1);
  const weekEnd = addDays(today, 7);
  const buckets = { today: [], tomorrow: [], thisWeek: [], later: [], past: [] };
  items.forEach(item => {
    const d = startOfDay(new Date(getDate(item)));
    if (d.getTime() === today.getTime()) buckets.today.push(item);
    else if (d.getTime() === tomorrow.getTime()) buckets.tomorrow.push(item);
    else if (d > tomorrow && d <= weekEnd) buckets.thisWeek.push(item);
    else if (d > weekEnd) buckets.later.push(item);
    else buckets.past.push(item);
  });
  const order = opts.order || ['today','tomorrow','thisWeek','later','past'];
  const labels = { today:'Today', tomorrow:'Tomorrow', thisWeek:'This week', later:'Later', past:'Past' };
  let out = '';
  order.forEach(key => {
    const list = buckets[key];
    if (!list.length) return;
    out += `<div class="flex items-center gap-3 my-4"><div class="text-xs font-bold uppercase tracking-wider muted">${labels[key]}</div><div class="text-[11px] muted">·</div><div class="text-[11px] muted">${list.length} ${opts.itemLabel || 'item'}${list.length > 1 ? 's' : ''}</div><div class="flex-1 h-px bg-[rgb(var(--border))]"></div></div>`;
    out += `<div class="space-y-2">${list.map(opts.render).join('')}</div>`;
  });
  return out || opts.empty || '';
}

function isDateInTimeOff(dateStr) {
  const d = startOfDay(new Date(dateStr));
  return State.timeOff.some(t => {
    const s = startOfDay(new Date(t.start));
    const e = startOfDay(new Date(t.end));
    return d >= s && d <= e;
  });
}

function applyTheme() {
  const t = State.theme;
  const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}
function setTheme(t) { State.theme = t; localStorage.setItem('tb-theme', t); applyTheme(); renderThemeToggle(); }

function renderThemeToggle() {
  const active = State.theme;
  const html = `<div class="flex items-center gap-0.5 p-0.5 rounded-full border border-[rgb(var(--border))] bg-[rgb(var(--surface))]">
    ${[['light','sun'],['system','monitor'],['dark','moon']].map(([k,i]) => `<button onclick="setTheme('${k}')" aria-label="${k}" class="grid place-items-center w-8 h-8 rounded-full transition ${active===k?'bg-sage-500 text-white':'muted hover:text-[rgb(var(--fg))]'}">${icon(i, 14)}</button>`).join('')}
  </div>`;
  $$('[data-theme-toggle]').forEach(s => { s.innerHTML = html; });
  iconEl();
}

function toast(msg, kind='success') {
  const k = { success:{bg:'#5F8259',ic:'check-circle'}, error:{bg:'#B91C1C',ic:'alert-circle'}, info:{bg:'#3B5668',ic:'info'}, warning:{bg:'#A16207',ic:'alert-triangle'} }[kind] || {bg:'#5F8259',ic:'check-circle'};
  const el = document.createElement('div');
  el.className = 'pointer-events-auto surface shadow-lift rounded-2xl px-4 py-3 flex items-center gap-3 animate-slideIn';
  el.innerHTML = `<div class="w-9 h-9 rounded-full grid place-items-center text-white shrink-0" style="background:${k.bg}">${icon(k.ic, 16)}</div><div class="text-sm font-medium flex-1">${esc(msg)}</div>`;
  $('#toast-root').appendChild(el); iconEl();
  setTimeout(() => { el.style.transition='all 0.3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(() => el.remove(), 300); }, 3200);
}

        ${actions.length ? `<div class="p-4 border-t border-[rgb(var(--border))] flex flex-wrap gap-2 justify-end">${actions.map(a => `<button onclick="${a.onclick}" class="btn ${a.variant==='primary'?'btn-primary':a.variant==='danger'?'btn-primary !bg-red-600 hover:!bg-red-700':a.variant==='ghost'?'btn-ghost':'btn-outline'}">${a.label}</button>`).join('')}</div>` : ''}

  document.addEventListener('keydown', escClose);
}

function updatePwStrength(val) {
  const segs = ['pw-seg-1','pw-seg-2','pw-seg-3'].map(id => document.getElementById(id));
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/\d/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;
  score = Math.min(3, score);
  const colors = ['#DC2626','#A16207','#5F8259'];
  segs.forEach((s, i) => { if (!s) return; s.style.background = i < score ? colors[score - 1] : 'rgb(var(--border))'; });
  const label = document.getElementById('pw-label');
  if (label) {
    const texts = ['Weak', 'Okay', 'Strong'];
    label.innerHTML = `${icon('info',11)} <span style="color:${val ? colors[score-1] || 'rgb(var(--muted))' : 'rgb(var(--muted))'}">${val ? texts[score-1] || 'Keep typing…' : 'Use 8+ characters with letters and numbers.'}</span>`;
    iconEl();
  }
}

function PageDashboard() {
  const u = State.user;

  const todaysAppts = APPOINTMENTS.filter(a => a.practitioner === u.id && sameDay(new Date(a.start), today)).sort((a,b)=>a.start-b.start);
  const upcoming = APPOINTMENTS.filter(a => a.practitioner === u.id && new Date(a.start) > today && a.status !== 'cancelled').sort((a,b)=>a.start-b.start).slice(0,3);
  const hour = today.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  const recent = APPOINTMENTS.filter(a => a.practitioner === u.id && new Date(a.start) <= today).sort((a,b) => b.start - a.start).slice(0, 10);
  const areaCounts = {};
  recent.forEach(a => (a.areas || []).forEach(x => areaCounts[x] = (areaCounts[x]||0)+1));
  const areaRanked = Object.entries(areaCounts).sort((a,b)=>b[1]-a[1]).slice(0, 3);
  const maxCount = areaRanked[0]?.[1] || 1;

  return `
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 space-y-6">
    <div>

function WeekView(date, appts) {

      </div>
      <div class="grid grid-cols-[52px_repeat(7,1fr)] relative">
        <div class="flex flex-col">${hours.map(h => `<div class="h-16 text-[10px] muted text-right pr-2 -mt-2">${h>12?h-12+' PM':h+' AM'}</div>`).join('')}</div>
        ${days.map(d => {
          const dayAppts = appts.filter(a => sameDay(new Date(a.start), d));

              const top = (startH - 8) * 64;

              return `<div onclick="event.stopPropagation();navigate('/app/appointments/${a.id}')" class="absolute left-1 right-1 rounded-lg px-2 py-1 text-xs cursor-pointer hover:scale-[1.02] transition overflow-hidden shadow-sm" style="top:${top}px;height:${height}px;background:${s.bg};border-left:3px solid ${s.color}"><div class="font-semibold truncate" style="color:${s.color}">${esc(c.name.split(' ')[0])}</div><div class="truncate text-[10px] muted">${esc(getService(a.service)?.name?.split(' ')[0] || '')}</div></div>`;

function DayView(date, appts) {
  const dayAppts = appts.filter(a => sameDay(new Date(a.start), date)).sort((a,b)=>a.start-b.start);

    <div class="grid grid-cols-[52px_1fr] relative">
      <div class="flex flex-col">${hours.map(h => `<div class="h-20 text-[10px] muted text-right pr-2 -mt-2">${h>12?h-12+' PM':h+' AM'}</div>`).join('')}</div>
      <div class="relative border-l border-[rgb(var(--border))]">
        ${hours.map(h => `<div class="cal-cell h-20 border-b border-[rgb(var(--border))]/60" onclick="createApptAt('${date.toISOString()}',${h})"><div class="cal-cell-add">${icon('plus', 12)}</div></div>`).join('')}
        ${dayAppts.map(a => {
          const c = getUser(a.client);
          const s = STATUS_STYLE[a.status] || STATUS_STYLE.pending;
          const startH = new Date(a.start).getHours() + new Date(a.start).getMinutes()/60;
          const top = (startH - 8) * 80;
          const height = (a.duration/60) * 80 - 4;
          const areas = (a.areas || []).slice(0,2).map(x => getArea(x)?.label).filter(Boolean);
          return `<div onclick="event.stopPropagation();navigate('/app/appointments/${a.id}')" class="absolute left-2 right-2 rounded-xl px-3 py-2 cursor-pointer hover:scale-[1.01] transition overflow-hidden shadow-sm" style="top:${top}px;height:${height}px;background:${s.bg};border-left:4px solid ${s.color}"><div class="flex items-center gap-2">${avatar(c, 26)}<div class="min-w-0 flex-1"><div class="font-semibold text-sm truncate" style="color:${s.color}">${esc(c.name)}</div><div class="text-xs muted truncate">${fmtTime(a.start)} · ${esc(getService(a.service)?.name || '')}</div>${areas.length ? `<div class="text-[10px] muted truncate mt-0.5">${areas.join(' · ')}</div>` : ''}</div></div></div>`;
        }).join('')}
      </div>

function MonthView(date, appts) {
  const y = date.getFullYear(), m = date.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const start = startOfWeek(first);
  const end = addDays(startOfWeek(last), 6);
  const days = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(new Date(d));
  return `
  <div class="grid grid-cols-7 text-center border-b border-[rgb(var(--border))] pb-2 mb-2">${['S','M','T','W','T','F','S'].map(d => `<div class="text-[10px] sm:text-xs muted uppercase tracking-wider">${d}</div>`).join('')}</div>

      return `<div class="cal-cell min-h-[80px] sm:min-h-[110px] p-1 sm:p-1.5 rounded-lg border border-[rgb(var(--border))] ${isToday(d)?'bg-sage-50/60 dark:bg-sage-900/20':''} ${!inMonth?'opacity-40':''} ${isOff?'bg-red-500/5':''}" onclick="createApptAt('${d.toISOString()}',10)"><div class="cal-cell-add">${icon('plus', 12)}</div><div class="text-[10px] sm:text-xs font-semibold ${isToday(d)?'text-sage-600':''} ${isOff?'text-red-500':''} mb-1">${d.getDate()}${isOff ? ' · off' : ''}</div><div class="space-y-0.5">${dayAppts.slice(0,2).map(a => { const c = getUser(a.client); const s = STATUS_STYLE[a.status] || STATUS_STYLE.pending; return `<div onclick="event.stopPropagation();navigate('/app/appointments/${a.id}')" class="text-[9px] sm:text-[10px] px-1 py-0.5 rounded truncate cursor-pointer" style="background:${s.bg};color:${s.color}">${esc(c.name.split(' ')[0])}</div>`; }).join('')}${dayAppts.length > 2 ? `<div class="text-[9px] muted">+${dayAppts.length-2}</div>` : ''}</div></div>`;
    }).join('')}
  </div>`;
}
function shiftCalendar(delta) { const d = new Date(State.calendarDate); if (State.calendarView === 'day') d.setDate(d.getDate() + delta); else if (State.calendarView === 'week') d.setDate(d.getDate() + delta*7); else d.setMonth(d.getMonth() + delta); set({ calendarDate: d }); }

/* ============================================================

   ============================================================ */
const NOTE_TEMPLATES = {
  free: { label:'Free-form', icon:'file-text', placeholder:'How did the session go? Anything to follow up?', starter:'' },
  soap: { label:'SOAP', icon:'clipboard-list', placeholder:'S: Subjective — what the client reports\nO: Objective — what you observe\nA: Assessment — your clinical read\nP: Plan — next steps', starter:'S: \nO: \nA: \nP: ' },
  dap:  { label:'DAP', icon:'list-checks', placeholder:'D: Data — observations and client reports\nA: Assessment — your interpretation\nP: Plan — next steps', starter:'D: \nA: \nP: ' },
};
let noteSaveTimers = {};
function renderNoteEditor(apptId, note) {
  const current = note || { content:'', template:'free', updatedAt:null };
  const tpl = NOTE_TEMPLATES[current.template] || NOTE_TEMPLATES.free;
  const saved = current.updatedAt ? relTime(current.updatedAt) : null;
  return `
    <div class="space-y-3">
      <div class="flex flex-wrap gap-2">
        ${Object.entries(NOTE_TEMPLATES).map(([key, t]) => `<button onclick="setNoteTemplate('${apptId}','${key}')" class="note-tpl ${current.template === key ? 'active' : ''}">${icon(t.icon, 12)} ${t.label}</button>`).join('')}
      </div>
      <textarea id="note-${apptId}" class="input" rows="6" placeholder="${esc(tpl.placeholder)}" oninput="onNoteInput('${apptId}', this.value)">${esc(current.content || tpl.starter)}</textarea>
      <div class="flex items-center justify-between">
        <div class="autosave" id="autosave-${apptId}">${saved ? `<span class="autosave-dot"></span> Saved ${saved}` : `<span class="muted">Draft not saved yet</span>`}</div>
        <button onclick="saveNoteNow('${apptId}')" class="btn btn-sm btn-primary">Save note</button>
      </div>
    </div>`;
}
function setNoteTemplate(apptId, key) {
  const existing = NOTES[apptId] || { content:'', template:'free', updatedAt:null };
  const tpl = NOTE_TEMPLATES[key];
  const content = existing.content && existing.content.trim().length > 0 ? existing.content : (tpl.starter || '');
  NOTES[apptId] = { content, template: key, updatedAt: new Date() };
  saveNotes();
  const ta = document.getElementById('note-' + apptId);
  if (ta) { ta.value = content; ta.placeholder = tpl.placeholder; }
  document.querySelectorAll('.note-tpl').forEach(b => b.classList.remove('active'));
  event?.target?.closest?.('.note-tpl')?.classList.add('active');
  toast(`${tpl.label} template applied`, 'info');
}
function onNoteInput(apptId, value) {
  const existing = NOTES[apptId] || { template:'free' };
  NOTES[apptId] = { ...existing, content: value, updatedAt: new Date() };
  clearTimeout(noteSaveTimers[apptId]);
  const el = document.getElementById('autosave-' + apptId);
  if (el) el.innerHTML = `<span class="muted">Saving…</span>`;
  noteSaveTimers[apptId] = setTimeout(() => {
    saveNotes();
    const el2 = document.getElementById('autosave-' + apptId);
    if (el2) el2.innerHTML = `<span class="autosave-dot"></span> Saved just now`;
    iconEl();
  }, 700);
}
function saveNoteNow(apptId) { saveNotes(); const el = document.getElementById('autosave-' + apptId); if (el) el.innerHTML = `<span class="autosave-dot"></span> Saved just now`; toast('Note saved'); }

            }).join('')}

      })() : `<div class="grid place-items-center"><div class="text-center p-6"><div class="w-14 h-14 rounded-2xl bg-sage-500/15 text-sage-600 grid place-items-center mx-auto mb-3">${icon('message-square', 26)}</div><div class="font-semibold">Select a conversation</div></div></div>`}

function sendMessage(form, convoId) {
  const input = form.querySelector('input');
  const text = input.value.trim();

}

function openServiceModal(editId) {
  const s = editId ? getService(editId) : null;
  const isEdit = !!s;
  modal({
    title: isEdit ? 'Edit service' : 'Add service',
    body: `<div class="space-y-3">
      <div><label class="text-sm font-medium mb-1.5 block">Service name</label><input id="svc-name" class="input" placeholder="e.g., Relaxation Massage" value="${s ? esc(s.name) : ''}"></div>

        <div><label class="text-sm font-medium mb-1.5 block">Price (₱)</label><input id="svc-price" type="number" class="input" value="${s ? s.price : 1200}"></div>

      <div><label class="text-sm font-medium mb-1.5 block">Preparation notes (optional)</label><textarea id="svc-prep" class="input" rows="2">${s ? esc(s.prep || '') : ''}</textarea></div>
    </div>`,
    actions: [
      { label:'Cancel', variant:'outline', onclick:'closeModal()' },
      { label: isEdit ? 'Save changes' : 'Add service', variant:'primary', onclick: `submitService('${editId || ''}')` }

function submitService(editId) {
  const name = document.getElementById('svc-name').value.trim();
  if (!name) { toast('Name is required', 'error'); return; }
  const payload = {
    name,
    description: document.getElementById('svc-desc').value.trim(),
    duration: parseInt(document.getElementById('svc-duration').value) || 60,
    price: parseInt(document.getElementById('svc-price').value) || 0,
    category: document.getElementById('svc-category').value,
    prep: document.getElementById('svc-prep').value.trim(),
  };
  if (editId) { const s = getService(editId); if (s) Object.assign(s, payload); toast('Service updated'); }
  else { SERVICES.push({ id:'sv'+Date.now(), practitioner: State.user.id, active:true, ...payload }); toast('Service added'); }
  closeModal(); render();
}
function toggleServiceActive(id) { const s = getService(id); if (!s) return; s.active = !(s.active !== false); toast(s.active ? 'Visible to clients' : 'Hidden from clients'); render(); }

function openAddTimeOff() {
  modal({
    title:'Add time off',
    body:`<div class="space-y-3"><div class="grid grid-cols-2 gap-3"><div><label class="text-sm font-medium mb-1.5 block">Start</label><input id="to-start" type="date" class="input" value="${new Date().toISOString().slice(0,10)}"></div><div><label class="text-sm font-medium mb-1.5 block">End</label><input id="to-end" type="date" class="input" value="${new Date().toISOString().slice(0,10)}"></div></div><div><label class="text-sm font-medium mb-1.5 block">Reason (optional)</label><input id="to-reason" class="input" placeholder="e.g., Holiday break"></div></div>`,
    actions:[{label:'Cancel',variant:'outline',onclick:'closeModal()'},{label:'Add',variant:'primary',onclick:'submitTimeOff()'}]

function submitTimeOff() {
  const start = document.getElementById('to-start').value;
  const end = document.getElementById('to-end').value;
  const reason = document.getElementById('to-reason').value.trim();
  if (!start || !end) { toast('Please provide both dates', 'error'); return; }
  if (new Date(end) < new Date(start)) { toast('End must be after start', 'error'); return; }
  State.timeOff.push({ id:'to'+Date.now(), start: new Date(start).toISOString(), end: new Date(end).toISOString(), reason: reason || 'Time off' });
  State.timeOff.sort((a,b) => new Date(a.start) - new Date(b.start));
  saveTimeOff(); closeModal(); toast('Time off added'); render();
}
function removeTimeOff(id) { State.timeOff = State.timeOff.filter(t => t.id !== id); saveTimeOff(); toast('Time off removed'); render(); }

let bookStep = 0;
let bookState = { practitioner:null, service:null, areas:[], date:null, time:null, ref:null };
let bookCat = '';

function getClientLastAppt() {
  if (!State.user) return null;
  return APPOINTMENTS.filter(a => a.client === State.user.id && a.status === 'completed').sort((a, b) => new Date(b.start) - new Date(a.start))[0] || null;
}

function BookingHeader(stepNum, totalSteps, title, subtitle) {
  const labels = ['Service','When & focus','Review'];
  return `
    <div class="mb-6">

function BookingSummaryPanel() {

  if (date) rows.push(['Date', fmtDate(date, {weekday:'long', month:'long', day:'numeric'})]);
  if (bookState.time) rows.push(['Time', bookState.time + ' <span class="muted font-normal">PST</span>']);
  if (s) rows.push(['Price', `<span class="font-display font-bold text-base">${fmtMoney(s.price)}</span>`, true]);
  return `

    ${rows.length === 0 ? `<div class="text-center py-8"><div class="w-12 h-12 rounded-2xl bg-sage-500/10 text-sage-600 grid place-items-center mx-auto mb-3">${icon('clipboard', 22)}</div><div class="text-sm font-medium">Start your booking</div><div class="text-xs muted mt-1">Details will appear here.</div></div>` : `<div>${rows.map(([label, value, big]) => `<div class="py-3 ${big?'':'border-b border-dashed border-[rgb(var(--border))]'}"><div class="text-[11px] uppercase tracking-wider muted font-bold">${label}</div><div class="${big ? '' : 'text-sm font-semibold mt-1'} mt-1">${value}</div></div>`).join('')}</div>${p?.verified ? `<div class="mt-4 p-3 rounded-xl bg-sage-500/10 flex items-start gap-2"><span class="text-sage-600 mt-0.5">${icon('shield-check', 14)}</span><div class="text-xs muted leading-relaxed"><span class="font-semibold text-[rgb(var(--fg))]">Verified practitioner.</span> Credentials reviewed.</div></div>` : ''}`}
  </div>`;
}
function BookStep1() {

function quickRebook() { const a = getClientLastAppt(); if (!a) return; bookState = { practitioner: a.practitioner, service: a.service, areas: [...(a.areas || [])], date: null, time: null }; bookStep = 1; render(); toast('Loaded from your last session'); }
function BookStep2() {
  const p = getUser(bookState.practitioner);
  const s = getService(bookState.service);
  const selectedDate = bookState.date ? new Date(bookState.date) : null;
  const today = new Date();
  const maxDate = addDays(today, 60);
  const viewYear = selectedDate ? selectedDate.getFullYear() : today.getFullYear();
  const viewMonth = selectedDate ? selectedDate.getMonth() : today.getMonth();
  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const lastOfMonth = new Date(viewYear, viewMonth + 1, 0);
  const gridStart = startOfWeek(firstOfMonth);
  const gridEnd = addDays(startOfWeek(lastOfMonth), 6);
  const gridDays = [];
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) gridDays.push(new Date(d));
  const slots = selectedDate ? generateSlots(selectedDate) : [];
  const morning = slots.filter(x => x.time.includes('AM'));
  const afternoon = slots.filter(x => x.time.includes('PM'));
  let nextAvail = null;
  for (let i = 0; i < 30 && !nextAvail; i++) {
    const d = addDays(today, i + 1);
    if (d.getDay() === 0) continue;
    if (isDateInTimeOff(d.toISOString())) continue;
    const daySlots = generateSlots(d);
    const first = daySlots.find(x => x.available);
    if (first) nextAvail = { date: d, time: first.time };
  }
  const areas = bookState.areas || [];
  const lastWithSame = State.user ? APPOINTMENTS.filter(a => a.client === State.user.id && a.practitioner === p.id && a.status === 'completed').sort((a, b) => new Date(b.start) - new Date(a.start))[0] : null;
  const lastAreas = lastWithSame ? (lastWithSame.areas || []).map(x => getArea(x)?.label).filter(Boolean) : [];
  const slotGroup = (title, iconName, list) => list.length === 0 ? '' : `<div class="mb-4"><div class="flex items-center gap-2 mb-2"><div class="w-6 h-6 rounded-lg bg-[rgb(var(--surface-2))] grid place-items-center muted">${icon(iconName, 12)}</div><div class="text-xs font-bold uppercase tracking-wider">${title}</div></div><div class="grid grid-cols-3 sm:grid-cols-4 gap-2">${list.map(sl => `<button onclick="${sl.available ? `bookState.time='${sl.time}';render()` : ''}" class="time-slot !py-2.5 !px-3 ${bookState.time === sl.time ? 'selected' : ''} ${!sl.available ? 'disabled' : ''}"><div class="flex items-center gap-1.5"><span class="font-semibold text-xs">${sl.time}</span></div><div class="slot-meta text-[10px] muted">${sl.available ? `${s.duration}m` : 'Full'}</div></button>`).join('')}</div></div>`;
  return `
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
    ${BookingHeader(2, 3, 'When works for you?', 'Choose a date and time. Add focus areas to help your practitioner prepare.')}
    <div class="grid lg:grid-cols-[1fr_280px] gap-5">
      <div class="space-y-4">
        <div class="card p-4 flex items-center gap-3">${avatar(p, 44)}<div class="min-w-0 flex-1"><div class="text-xs muted mb-0.5">Booking with</div><div class="font-semibold text-sm truncate">${esc(p.name)}</div><div class="text-xs muted truncate">${esc(s.name)} · ${s.duration} min · ${fmtMoney(s.price)}</div></div><button onclick="bookStep=0;render()" class="text-xs text-sage-600 font-semibold hover:underline">Change</button></div>
        ${nextAvail ? `<button onclick="bookState.date='${nextAvail.date.toISOString()}';bookState.time='${nextAvail.time}';render()" class="w-full card p-4 text-left hover:border-sage-400 transition border-l-4 !border-l-sage-500"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-sage-500 text-white grid place-items-center shrink-0">${icon('zap', 18)}</div><div class="flex-1 min-w-0"><div class="text-xs font-bold tracking-widest uppercase text-sage-600">Next available</div><div class="font-semibold text-sm mt-0.5">${fmtDate(nextAvail.date, {weekday:'long', month:'short', day:'numeric'})} at ${nextAvail.time}</div></div>${icon('arrow-right', 16, 'muted')}</div></button>` : ''}
        <div class="card p-4 focus-ring">
          <div class="flex items-start gap-3 mb-3"><div class="w-10 h-10 rounded-xl bg-sage-500 text-white grid place-items-center shrink-0">${icon('sparkles', 18)}</div><div class="flex-1 min-w-0"><div class="font-display font-semibold text-sm flex items-center gap-2 flex-wrap">Which areas need attention?<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-sage-500/15 text-sage-700 dark:text-sage-300 font-semibold uppercase tracking-wider">Optional</span></div><div class="text-xs muted mt-0.5">Your practitioner will see this before your session.</div>${areas.length ? `<div class="text-xs font-semibold text-sage-600 mt-2">${areas.length} area${areas.length>1?'s':''} selected</div>` : ''}</div></div>
          ${lastAreas.length && !areas.length ? `<div class="mb-3 p-3 rounded-xl surface-2"><div class="text-xs muted mb-2">From your last session with ${esc(p.first)}:</div><div class="flex flex-wrap gap-1.5 mb-2">${lastAreas.map(x => `<span class="text-[10px] px-2 py-0.5 rounded-full bg-sage-500/15 text-sage-700 dark:text-sage-300">${x}</span>`).join('')}</div><button onclick="applyLastAreas()" class="text-xs text-sage-600 font-semibold hover:underline flex items-center gap-1">${icon('rotate-ccw', 12)} Use these again</button></div>` : ''}
          <div class="flex flex-wrap gap-2 mb-3">${BODY_PACKS.map(pk => `<button onclick="applyPack('${pk.id}')" class="chip chip-off chip-sm !gap-1.5">${icon(pk.icon, 12)} ${pk.label}</button>`).join('')}${areas.length ? `<button onclick="bookState.areas=[];render()" class="chip chip-off chip-sm">${icon('x', 12)} Clear</button>` : ''}</div>
          <div class="grid sm:grid-cols-2 gap-3"><div class="surface-2 rounded-2xl p-3">${BodyMapSVG(areas)}</div><div class="max-h-[340px] overflow-y-auto pr-1 space-y-1.5">${BODY_AREAS.map(a => { const on = areas.includes(a.id); return `<button onclick="toggleArea('${a.id}')" class="w-full flex items-start gap-3 p-3 rounded-xl text-left transition ${on?'bg-sage-500/15 border border-sage-500/40':'surface-2 hover:bg-sage-500/5 border border-transparent'}"><div class="w-5 h-5 rounded-md border-2 shrink-0 mt-0.5 grid place-items-center ${on?'bg-sage-500 border-sage-500':'border-[rgb(var(--border))]'}">${on?icon('check', 11, 'text-white'):''}</div><div class="flex-1 min-w-0"><div class="text-sm font-medium">${esc(a.label)}</div><div class="text-xs muted">${esc(a.hint)}</div></div></button>`; }).join('')}</div></div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div class="card p-4">
            <div class="flex items-center justify-between mb-4"><button onclick="shiftBookMonth(-1)" class="w-9 h-9 rounded-full grid place-items-center hover:bg-black/5">${icon('chevron-left', 16)}</button><div class="font-display font-semibold">${firstOfMonth.toLocaleDateString('en-US', {month:'long', year:'numeric'})}</div><button onclick="shiftBookMonth(1)" class="w-9 h-9 rounded-full grid place-items-center hover:bg-black/5">${icon('chevron-right', 16)}</button></div>
            <div class="cal-grid text-[11px] uppercase tracking-wider muted font-bold mb-2">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="text-center">${d[0]}</div>`).join('')}</div>
            <div class="cal-grid">${gridDays.map(d => { const inMonth = d.getMonth() === viewMonth; const inRange = d >= new Date(today.getFullYear(), today.getMonth(), today.getDate()) && d <= maxDate; const isSelected = selectedDate && sameDay(d, selectedDate); const isSunday = d.getDay() === 0; const off = isDateInTimeOff(d.toISOString()); const disabled = !inMonth || !inRange || isSunday || off; const hasAvail = !disabled; return `<button onclick="${disabled ? '' : `bookState.date='${d.toISOString()}';bookState.time=null;render()`}" class="cal-day ${isSelected ? 'selected' : ''} ${isToday(d) ? 'today' : ''} ${disabled ? 'disabled' : ''} ${off ? 'time-off' : ''}" ${disabled ? 'disabled' : ''}><span>${d.getDate()}</span>${hasAvail && !isSelected ? '<span class="avail-dot"></span>' : ''}</button>`; }).join('')}</div>
          </div>
          <div class="card p-4">${!selectedDate ? `<div class="py-12 text-center"><div class="w-14 h-14 rounded-2xl bg-sage-500/10 text-sage-600 grid place-items-center mx-auto mb-4">${icon('calendar-days', 26)}</div><div class="font-semibold text-sm">Select a date</div></div>` : slots.length === 0 ? `<div class="py-12 text-center"><div class="font-semibold text-sm">Closed this day</div></div>` : `<div class="flex items-center justify-between mb-3"><div class="font-display font-semibold text-sm">${fmtDate(selectedDate, {weekday:'long', month:'short', day:'numeric'})}</div></div><div class="max-h-[360px] overflow-y-auto pr-1">${slotGroup('Morning', 'sunrise', morning)}${slotGroup('Afternoon', 'sun', afternoon)}</div>`}</div>
        </div>
      </div>
      <div class="hidden lg:block">${BookingSummaryPanel()}</div>
    </div>
    <div class="flex flex-col sm:flex-row gap-2 mt-6 lg:max-w-[calc(100%-300px)]"><button onclick="bookStep=0;render()" class="btn btn-outline">${icon('arrow-left', 14)} Back</button><button ${bookState.date && bookState.time ? '' : 'disabled'} onclick="bookStep=2;render()" class="btn btn-primary flex-1">Review ${icon('arrow-right', 14)}</button></div>
  </div>`;
}
function applyLastAreas() {
  const p = bookState.practitioner ? getUser(bookState.practitioner) : null;
  if (!p || !State.user) return;
  const last = APPOINTMENTS.filter(a => a.client === State.user.id && a.practitioner === p.id && a.status === 'completed').sort((a, b) => new Date(b.start) - new Date(a.start))[0];
  if (last) { bookState.areas = [...(last.areas || [])]; render(); toast('Loaded from last session'); }
}
function generateSlots(date) { const wd = date.getDay(); if (wd === 0) return []; const base = wd === 6 ? [['10:00 AM', true], ['11:00 AM', false], ['12:00 PM', true], ['1:00 PM', true]] : [['9:00 AM', true], ['9:30 AM', false], ['10:00 AM', true], ['10:30 AM', true], ['11:00 AM', false], ['11:30 AM', true], ['1:00 PM', true], ['1:30 PM', true], ['2:00 PM', false], ['2:30 PM', true], ['3:00 PM', true], ['3:30 PM', false]]; return base.map(([t, avail]) => ({ time: t, available: avail })); }
function shiftBookMonth(delta) { const d = bookState.date ? new Date(bookState.date) : new Date(); d.setMonth(d.getMonth() + delta); bookState.date = d.toISOString(); render(); }
function toggleArea(id) { const arr = bookState.areas || []; bookState.areas = arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id]; render(); }
function applyPack(id) { const pk = BODY_PACKS.find(p => p.id === id); if (pk) { bookState.areas = [...pk.areas]; render(); } }

function BookStep3() {
  const p = getUser(bookState.practitioner);
  const s = getService(bookState.service);
  const d = bookState.date ? new Date(bookState.date) : new Date();
  const areas = (bookState.areas || []).map(x => getArea(x)).filter(Boolean);
  return `
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
    ${BookingHeader(3, 3, 'Confirm your booking', 'One last check before we lock it in.')}
    <div class="card overflow-hidden mb-4">
      <div class="p-5 flex items-center gap-4 border-b border-[rgb(var(--border))]">${avatar(p, 56)}<div class="min-w-0 flex-1"><div class="font-display font-semibold truncate">${esc(p.name)}</div><div class="text-xs muted truncate">${esc(p.title)} · ${esc(p.location)}</div></div></div>
      <div class="p-5 grid grid-cols-2 gap-4 text-sm"><div><div class="text-xs muted mb-1">Service</div><div class="font-medium">${esc(s.name)}</div><div class="text-xs muted mt-0.5">${s.duration} min</div></div><div><div class="text-xs muted mb-1">When</div><div class="font-medium">${fmtDate(d, {weekday:'short', month:'short', day:'numeric'})}</div><div class="text-xs muted mt-0.5">${bookState.time} PST</div></div></div>
      ${areas.length ? `<div class="p-5 border-t border-dashed border-[rgb(var(--border))]"><div class="text-xs muted mb-2">Focus areas</div><div class="flex flex-wrap gap-1.5">${areas.map(a => `<span class="chip chip-on !min-h-0 !py-1 !px-3 !text-xs">${esc(a.label)}</span>`).join('')}</div></div>` : ''}
      <div class="p-5 border-t border-dashed border-[rgb(var(--border))] flex items-center justify-between"><div class="font-display font-semibold">Total</div><div class="font-display font-bold text-xl">${fmtMoney(s.price)}</div></div>
    </div>
    <div class="p-3 rounded-2xl surface-2 text-xs muted flex items-start gap-2 mb-4">${icon('info', 12)}<span>Free cancellation up to 24 hours before. Reminders go out 24h and 2h ahead.</span></div>
    <button onclick="confirmBooking()" class="btn btn-lg btn-primary w-full">Confirm booking</button>
  </div>`;
}
function BookSuccess() {
  const p = getUser(bookState.practitioner);
  const s = getService(bookState.service);
  const d = bookState.date ? new Date(bookState.date) : new Date();
  const areas = (bookState.areas || []).map(x => getArea(x)).filter(Boolean);
  const ref = bookState.ref;
  return `
  <div class="max-w-xl mx-auto px-4 sm:px-6 py-8">
    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-full bg-sage-500 text-white grid place-items-center mx-auto mb-4 animate-pop">${icon('check', 40)}</div>
      <h1 class="font-display font-bold text-3xl tracking-tight">You're all set!</h1>
      <p class="muted text-sm mt-2">We've sent the details to your email.</p>
      <div class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[rgb(var(--surface-2))] text-xs font-mono">${icon('hash', 11)} ${esc(ref)}</div>
    </div>
    <div class="card p-5 mb-4">
      <div class="flex items-center gap-4 mb-4">${avatar(p, 56)}<div class="min-w-0 flex-1"><div class="font-display font-semibold truncate">${esc(p.name)}</div><div class="text-xs muted truncate">${esc(p.title)}</div></div></div>
      <div class="grid grid-cols-2 gap-4 text-sm"><div><div class="text-xs muted mb-1">Service</div><div class="font-medium">${esc(s.name)}</div></div><div><div class="text-xs muted mb-1">When</div><div class="font-medium">${fmtDate(d, {month:'short', day:'numeric'})} · ${bookState.time}</div></div></div>
      ${areas.length ? `<div class="pt-4 mt-4 border-t border-dashed border-[rgb(var(--border))]"><div class="text-xs muted mb-2">We'll focus on</div><div class="flex flex-wrap gap-1.5">${areas.map(a => `<span class="chip chip-on !min-h-0 !py-1 !px-3 !text-xs">${esc(a.label)}</span>`).join('')}</div></div>` : ''}
    </div>
    <a href="#/app/appointments" class="btn btn-outline w-full">View my sessions</a>
    <a href="#/app/dashboard" class="btn btn-ghost w-full mt-2 text-sage-600 font-semibold">Back to home</a>
  </div>`;
}
function PageBook() {
  const upcoming = getClientUpcoming();
  if (upcoming) {
    const pr = getUser(upcoming.practitioner); const s = getService(upcoming.service);
    return `
      <div class="max-w-2xl mx-auto px-4 sm:px-6 py-10">
        <div class="card p-8 text-center">
          <div class="w-16 h-16 rounded-2xl bg-sage-500/15 text-sage-600 grid place-items-center mx-auto mb-4">${icon('calendar-check', 30)}</div>
          <h1 class="font-display font-bold text-2xl tracking-tight">You already have an upcoming session</h1>
          <p class="muted text-sm mt-2 max-w-md mx-auto">You can book again once your current session is done. This keeps things simple — one session at a time.</p>
          <div class="mt-6 p-4 rounded-2xl surface-2 text-left">
            <div class="flex items-center gap-3 mb-3">
              ${avatar(pr, 40)}
              <div class="min-w-0 flex-1">
                <div class="font-semibold text-sm truncate">${esc(pr.name)}</div>
                <div class="text-xs muted truncate">${esc(s?.name || '')}</div>
              </div>
            </div>
            <div class="text-sm"><strong>${fmtDate(upcoming.start, {weekday:'long', month:'long', day:'numeric'})}</strong> · ${fmtTime(upcoming.start)} PST</div>
          </div>
          <div class="mt-6 flex flex-wrap justify-center gap-2">
            <a href="#/app/appointments/${upcoming.id}" class="btn btn-primary">View session details</a>
            <a href="#/app/dashboard" class="btn btn-outline">Back to home</a>
          </div>
        </div>
      </div>
    `;
  }
  if (bookStep === 0) return BookStep1();
  if (bookStep === 1) return BookStep2();
  if (bookStep === 2) return BookStep3();
  return BookSuccess();
}
function selectService(id) {
  if (getClientUpcoming()) { toast('You already have an upcoming session.', 'warning'); return; }
  const s = getService(id); bookState.practitioner = s.practitioner; bookState.service = id; bookState.areas = []; bookStep = 1; render(); window.scrollTo({top:0});
}
function confirmBooking() {
  if (getClientUpcoming()) { toast('You already have an upcoming session.', 'warning'); return; }
  const p = getUser(bookState.practitioner);
  const s = getService(bookState.service);
  const d = bookState.date ? new Date(bookState.date) : new Date();
  const [time, ampm] = bookState.time.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  d.setHours(h, m, 0, 0);
  const ref = 'TB-' + new Date().getFullYear().toString().slice(2) + '01-' + Math.floor(1000 + Math.random()*9000);
  APPOINTMENTS.push({ id: 'ap' + Date.now(), client: State.user.id, practitioner: p.id, service: s.id, start: d, duration: s.duration, status: 'pending', mode: p.consultation, location: p.location, areas: [...(bookState.areas || [])], ref });
  bookState.ref = ref;
  bookStep = 3;
  toast('Booked!');
  render();
}

/* ============================================================
   HELP / 404
   ============================================================ */
function PageHelp() {
  const cats = [
    { title:'Getting started', items:[{ q:'How do I book an appointment?', a:'Click "Book", pick a service, choose a date and time, and tap the areas that need attention.' },{ q:'What are focus areas?', a:'During booking you can tap the areas that need attention (like neck or lower back). Your practitioner sees this before your session.' },{ q:'Can I book more than one session at a time?', a:'For now, one session at a time. Once your current session is completed, you can book again.' }]},
    { title:'Notes', items:[{ q:'What note templates are available?', a:'Free-form, SOAP, and DAP. Choose whichever matches your practice.' },{ q:'Are notes autosaved?', a:'Yes. Notes save as you type — you\'ll see a "Saved" indicator.' }]},
    { title:'Payments', items:[{ q:'How do I pay?', a:'After your session, you receive an invoice. Pay with GCash, Maya, or card.' }]},
  ];
  return `<div class="min-h-screen"><header class="border-b border-[rgb(var(--border))]"><div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between"><a href="#/">${LogoMark(true)}</a><div class="flex items-center gap-2"><div data-theme-toggle></div><a href="${State.user ? '#/app/dashboard' : '#/login'}" class="btn btn-sm btn-outline">${State.user ? 'Back to app' : 'Log in'}</a></div></div></header><div class="max-w-3xl mx-auto px-4 sm:px-6 py-8"><div class="text-center mb-8"><div class="w-14 h-14 rounded-2xl bg-sage-500/15 text-sage-600 grid place-items-center mx-auto mb-3">${icon('help-circle', 26)}</div><h1 class="font-display font-bold text-3xl tracking-tight">Help Center</h1><p class="muted mt-2">Simple answers to common questions.</p></div><div class="space-y-6">${cats.map(sec => `<div><div class="text-xs font-bold uppercase tracking-wider text-sage-600 mb-3">${esc(sec.title)}</div><div class="space-y-2">${sec.items.map(it => `<details class="card p-4 group"><summary class="cursor-pointer list-none flex items-center justify-between gap-3"><span class="font-semibold text-sm">${esc(it.q)}</span>${icon('chevron-right', 14, 'muted group-open:rotate-90 transition-transform shrink-0')}</summary><p class="mt-3 text-sm muted leading-relaxed">${esc(it.a)}</p></details>`).join('')}</div></div>`).join('')}</div></div></div>`;
}
function Page404() { return `<div class="min-h-[70vh] grid place-items-center px-4"><div class="text-center max-w-md"><div class="w-20 h-20 rounded-3xl bg-sage-500/15 text-sage-600 grid place-items-center mx-auto mb-6">${icon('compass', 40)}</div><div class="font-display font-bold text-5xl tracking-tight">404</div><div class="font-display font-semibold text-xl mt-3">Page not found</div><p class="muted text-sm mt-3">Let's get you back on track.</p><div class="flex flex-wrap justify-center gap-2 mt-6"><a href="#/" class="btn btn-outline">Home</a>${State.user ? `<a href="#/app/dashboard" class="btn btn-primary">Go to dashboard</a>` : `<a href="#/login" class="btn btn-primary">Log in</a>`}</div></div></div>`; }

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const root = $('#root');
  const { path, parts } = getRoute();
  if (!path || path === '') root.innerHTML = Landing();
  else if (path === 'login') root.innerHTML = LoginPage();
  else if (path === 'register') root.innerHTML = RegisterPage();
  else if (path === 'help') root.innerHTML = PageHelp();
  else if (path === 'onboard') root.innerHTML = OnboardingPage();
  else if (!State.user) root.innerHTML = LoginPage();
  else if (path.startsWith('app/')) {
    let page = '';
    const sub = parts.slice(1);
    const u = State.user;
    if (sub.length === 0 || sub[0] === 'dashboard') page = PageDashboard();
    else if (sub[0] === 'calendar' && u.role === 'practitioner') page = PageCalendar();
    else if (sub[0] === 'appointments') page = sub[1] ? PageAppointmentDetail(sub[1]) : PageAppointments();
    else if (sub[0] === 'clients' && u.role === 'practitioner') page = sub[1] ? PageClientDetail(sub[1]) : PageClients();
    else if (sub[0] === 'services' && u.role === 'practitioner') page = PageServices();
    else if (sub[0] === 'availability' && u.role === 'practitioner') page = PageAvailability();
    else if (sub[0] === 'reports' && u.role === 'practitioner') page = PageAnalytics();
    else if (sub[0] === 'verification' && u.role === 'practitioner') page = PageVerification();
    else if (sub[0] === 'invoices') page = PageInvoices();
    else if (sub[0] === 'notifications') page = PageNotifications();
    else if (sub[0] === 'messages') page = PageMessages(sub[1]);
    else if (sub[0] === 'settings') page = PageSettings();
    else if (sub[0] === 'book' && u.role === 'client') page = PageBook();
    else page = Page404();
    root.innerHTML = AppShell(page);
  }
  else root.innerHTML = Page404();
  iconEl();
  renderThemeToggle();
  $$('.body-zone').forEach(z => { z.addEventListener('click', () => { const zone = z.dataset.zone; if (zone === 'chest' || zone === 'upper-back') toggleArea('upper-back'); else toggleArea(zone); }); });
}

window.addEventListener('hashchange', () => { render(); window.scrollTo({top:0}); });
applyTheme();
render();
</script>
