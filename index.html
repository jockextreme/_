function fmtDate(d, opts={month:'short', day:'numeric'}) { const date = typeof d === 'string' ? new Date(d) : d; return date.toLocaleDateString('en-US', opts); }
function fmtTime(d) { const date = typeof d === 'string' ? new Date(d) : d; return date.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }
function fmtDateTime(d) { return `${fmtDate(d)} · ${fmtTime(d)}`; }
function fmtMoney(n) { return '₱' + Number(n).toLocaleString(); }
function relTime(d) {
  const s = Math.floor((Date.now() - new Date(d).getTime())/1000);
  if (Math.abs(s) < 60) return 'just now';
  const m = Math.floor(Math.abs(s)/60), h = Math.floor(m/60), dd = Math.floor(h/24);
  return s < 0 ? (m<60?'in '+m+'m':h<24?'in '+h+'h':'in '+dd+'d') : (m<60?m+'m ago':h<24?h+'h ago':dd<7?dd+'d ago':fmtDate(d,{month:'short',day:'numeric'}));
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function startOfWeek(d){ const x=new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; }
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isToday(d){ return sameDay(new Date(d), new Date()); }
function isTomorrow(d) { return sameDay(new Date(d), addDays(new Date(), 1)); }
function isYesterday(d) { return sameDay(new Date(d), addDays(new Date(), -1)); }

/**
 * Groups items by date, in the order we want to display them.
 * buckets: { today, tomorrow, thisWeek, later, past, [custom] }
 */
function groupByDate(items, getDate, opts = {}) {
  const now = new Date();
  const today = startOfDay(now);
  const tomorrow = addDays(today, 1);
  const weekEnd = addDays(today, 7);
  const buckets = { today: [], tomorrow: [], thisWeek: [], later: [], past: [] };
  items.forEach(item => {
    const d = startOfDay(new Date(getDate(item)));
    if (d.getTime() === today.getTime()) buckets.today.push(item);
    else if (d.getTime() === tomorrow.getTime()) buckets.tomorrow.push(item);
    else if (d > tomorrow && d <= weekEnd) buckets.thisWeek.push(item);
    else if (d > weekEnd) buckets.later.push(item);
    else buckets.past.push(item);
  });
  const order = opts.order || ['today','tomorrow','thisWeek','later','past'];
  const labels = { today:'Today', tomorrow:'Tomorrow', thisWeek:'This week', later:'Later', past:'Past' };
  let out = '';
  order.forEach(key => {
    const list = buckets[key];
    if (!list.length) return;
    out += `<div class="date-group"><div class="text-xs font-bold uppercase tracking-wider muted">${labels[key]}</div><div class="text-[11px] muted">·</div><div class="text-[11px] muted">${list.length} ${opts.itemLabel || 'item'}${list.length > 1 ? 's' : ''}</div><div class="date-group-line"></div></div>`;
    out += `<div class="space-y-2">${list.map(opts.render).join('')}</div>`;
  });
  return out || opts.empty || '';
}

function applyTheme() {
  const t = State.theme;
  const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
}
function setTheme(t) { State.theme = t; localStorage.setItem('tb-theme', t); applyTheme(); renderThemeToggle(); }

function renderThemeToggle() {
  const active = State.theme;
  const html = `<div class="flex items-center gap-0.5 p-0.5 rounded-full border border-[rgb(var(--border))] bg-[rgb(var(--surface))]">
    ${[['light','sun'],['system','monitor'],['dark','moon']].map(([k,i]) => `<button onclick="setTheme('${k}')" aria-label="${k}" class="grid place-items-center w-8 h-8 rounded-full transition ${active===k?'bg-sage-500 text-white':'muted hover:text-[rgb(var(--fg))]'}">${icon(i, 14)}</button>`).join('')}
  </div>`;
  $$('[data-theme-toggle]').forEach(s => { s.innerHTML = html; });
  iconEl();
}

function toast(msg, kind='success') {
  const k = { success:{bg:'#5F8259',ic:'check-circle'}, error:{bg:'#B91C1C',ic:'alert-circle'}, info:{bg:'#3B5668',ic:'info'}, warning:{bg:'#A16207',ic:'alert-triangle'} }[kind] || {bg:'#5F8259',ic:'check-circle'};
  const el = document.createElement('div');
  el.className = 'pointer-events-auto surface shadow-lift rounded-2xl px-4 py-3 flex items-center gap-3 animate-slideIn';
  el.innerHTML = `<div class="w-9 h-9 rounded-full grid place-items-center text-white shrink-0" style="background:${k.bg}">${icon(k.ic, 16)}</div><div class="text-sm font-medium flex-1">${esc(msg)}</div>`;
  $('#toast-root').appendChild(el); iconEl();
  setTimeout(() => { el.style.transition='all 0.3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(() => el.remove(), 300); }, 3200);
}

function MonthView(date, appts) {
  const y = date.getFullYear(), m = date.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const start = startOfWeek(first);
  const end = addDays(startOfWeek(last), 6);
  const days = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) days.push(new Date(d));
  return `
  <div class="grid grid-cols-7 text-center border-b border-[rgb(var(--border))] pb-2 mb-2">${['S','M','T','W','T','F','S'].map(d => `<div class="text-[10px] sm:text-xs muted uppercase tracking-wider">${d}</div>`).join('')}</div>
  <div class="grid grid-cols-7 gap-1">
    ${days.map(d => {
      const inMonth = d.getMonth() === m;
      const dayAppts = appts.filter(a => sameDay(new Date(a.start), d)).sort((a,b)=>a.start-b.start);
      return `<div class="cal-cell min-h-[80px] sm:min-h-[110px] p-1 sm:p-1.5 rounded-lg border border-[rgb(var(--border))] ${isToday(d)?'bg-sage-50/60 dark:bg-sage-900/20':''} ${!inMonth?'opacity-40':''}" onclick="createApptAt('${d.toISOString()}',10)"><div class="cal-cell-add">${icon('plus', 12)}</div>

function shiftCalendar(delta) {
  const d = new Date(State.calendarDate);
  if (State.calendarView === 'day') d.setDate(d.getDate() + delta);
  else if (State.calendarView === 'week') d.setDate(d.getDate() + delta*7);
  else d.setMonth(d.getMonth() + delta);
  set({ calendarDate: d });
}

      <div class="space-y-3">${AVAILABILITY.map((d,i) => `<div class="p-3 surface-2 rounded-2xl"><div class="flex items-center gap-3 mb-2"><label class="flex items-center gap-2 flex-1"><input type="checkbox" ${d.enabled?'checked':''} onchange="toggleDay(${i},this.checked)" class="rounded"><span class="text-sm font-semibold">${d.day}</span></label></div>${d.enabled ? `<div class="flex flex-wrap items-center gap-2 text-sm"><input type="time" value="${d.start}" class="input !h-11 !w-32"><span class="muted">to</span><input type="time" value="${d.end}" class="input !h-11 !w-32"><span class="text-xs muted">Break</span><input type="time" value="${d.breakStart||'12:00'}" class="input !h-10 !w-28 !text-sm"><span class="text-xs muted">to</span><input type="time" value="${d.breakEnd||'13:00'}" class="input !h-10 !w-28 !text-sm"></div>` : `<div class="text-sm muted">Unavailable</div>`}</div>`).join('')}</div>
      <div class="flex justify-end mt-5"><button onclick="toast('Working hours updated')" class="btn btn-primary">Save changes</button></div>
    </div>
  </div>`;
}
function toggleDay(i, v) { AVAILABILITY[i].enabled = v; render(); }

/* ============================================================
   3-STEP BOOKING — with return-client auto-fill & focus emphasis
   ============================================================ */
let bookStep = 0;
let bookState = { practitioner:null, service:null, areas:[], date:null, time:null, ref:null, fromLast:false };
let bookCat = '';

function getClientLastAppt() {
  if (!State.user) return null;
  return APPOINTMENTS
    .filter(a => a.client === State.user.id && a.status !== 'cancelled')
    .sort((a, b) => new Date(b.start) - new Date(a.start))[0] || null;
}

function BookingHeader(stepNum, totalSteps, title, subtitle) {
  const labels = ['Service','When & where','Review'];
  return `
    <div class="mb-6">
      <div class="flex items-center justify-between gap-2 mb-4">
        ${stepNum > 1 ? `<button onclick="bookStep=${stepNum-2};render()" class="btn btn-sm btn-ghost">${icon('arrow-left', 14)} Back</button>` : `<button onclick="navigate('/app/dashboard')" class="btn btn-sm btn-ghost">${icon('x', 14)} Cancel</button>`}
        <div class="text-xs muted font-medium">Step ${stepNum} of ${totalSteps}</div>
      </div>
      <div class="flex items-center gap-1.5 mb-5">
        ${labels.map((l, i) => `<div class="flex-1 h-1.5 rounded-full ${i < stepNum ? 'bg-sage-500' : 'bg-[rgb(var(--border))]'} transition-colors"></div>`).join('')}
      </div>
      <div class="text-xs font-bold tracking-widest uppercase text-sage-600 mb-1">Booking</div>
      <h1 class="font-display font-bold text-2xl sm:text-3xl tracking-tight">${title}</h1>
      ${subtitle ? `<p class="muted text-sm mt-1.5 max-w-2xl leading-relaxed">${subtitle}</p>` : ''}
    </div>`;
}

function BookingSummaryPanel() {
  const p = bookState.practitioner ? getUser(bookState.practitioner) : null;
  const s = bookState.service ? getService(bookState.service) : null;
  const areas = (bookState.areas || []).map(x => getArea(x)).filter(Boolean);
  const date = bookState.date ? new Date(bookState.date) : null;
  const rows = [];
  if (p) rows.push(['Practitioner', `<div class="flex items-center gap-2">${avatar(p, 24)}<span>${esc(p.name)}</span></div>`]);
  if (s) rows.push(['Service', `${esc(s.name)} <span class="muted font-normal">· ${s.duration} min</span>`]);
  if (areas.length) rows.push(['Focus areas', `<div class="flex flex-wrap gap-1">${areas.map(a => `<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-sage-500/15 text-sage-700 dark:text-sage-300">${esc(a.label)}</span>`).join('')}</div>`]);
  if (date) rows.push(['Date', fmtDate(date, {weekday:'long', month:'long', day:'numeric'})]);
  if (bookState.time) rows.push(['Time', bookState.time + ' <span class="muted font-normal">PST</span>']);
  if (s) rows.push(['Price', `<span class="font-display font-bold text-base">${fmtMoney(s.price)}</span>`, true]);
  return `
  <div class="card p-5 lg:sticky lg:top-24">
    <div class="flex items-center justify-between mb-4"><div class="font-display font-semibold">Your booking</div>${icon('clipboard-list', 16, 'muted')}</div>
    ${rows.length === 0 ? `<div class="text-center py-8"><div class="w-12 h-12 rounded-2xl bg-sage-500/10 text-sage-600 grid place-items-center mx-auto mb-3">${icon('clipboard', 22)}</div><div class="text-sm font-medium">Start your booking</div><div class="text-xs muted mt-1">Details will appear here.</div></div>` : `
      <div>${rows.map(([label, value, big]) => `<div class="py-3 ${big?'':'border-b border-dashed border-[rgb(var(--border))]'}"><div class="text-[11px] uppercase tracking-wider muted font-bold">${label}</div><div class="${big ? '' : 'text-sm font-semibold mt-1'} mt-1">${value}</div></div>`).join('')}</div>
      ${p?.verified ? `<div class="mt-4 p-3 rounded-xl bg-sage-500/10 flex items-start gap-2"><span class="text-sage-600 mt-0.5">${icon('shield-check', 14)}</span><div class="text-xs muted leading-relaxed"><span class="font-semibold text-[rgb(var(--fg))]">Verified practitioner.</span> Credentials reviewed.</div></div>` : ''}`}
  </div>`;
}

/* STEP 1 — Service with return-client hint */
function BookStep1() {
  let services = [...SERVICES];
  const lastAppt = getClientLastAppt();
  if (lastAppt) services.sort((a, b) => (b.practitioner === lastAppt.practitioner) - (a.practitioner === lastAppt.practitioner));
  const cats = [...new Set(services.map(s => s.category))];
  const showReturnHint = lastAppt && !bookState.practitioner;
  return `
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    ${BookingHeader(1, 3, 'What kind of session do you need?', 'Pick a service. Your practitioner is shown with each one. You can browse by category.')}
    ${showReturnHint ? (() => {
      const lp = getUser(lastAppt.practitioner);
      const ls = getService(lastAppt.service);
      const lastAreas = (lastAppt.areas || []).map(x => getArea(x)?.label).filter(Boolean);
      return `<div class="card p-4 mb-4 border-l-4 !border-l-sage-500">
        <div class="flex items-start gap-3 flex-wrap">
          <div class="w-10 h-10 rounded-xl bg-sage-500/15 text-sage-600 grid place-items-center shrink-0">${icon('history', 18)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <div class="font-semibold text-sm">Welcome back — continue with ${esc(lp.first)}?</div>
            </div>
            <div class="text-xs muted mt-0.5">Last session: ${esc(ls.name)} on ${fmtDate(lastAppt.start, {month:'short', day:'numeric'})}${lastAreas.length ? ' · ' + lastAreas.join(', ') : ''}</div>
          </div>
          <button onclick="quickRebook()" class="btn btn-sm btn-primary">${icon('zap', 14)} Book again</button>
        </div>
      </div>`;
    })() : ''}
    <div class="grid lg:grid-cols-[1fr_300px] gap-5">
      <div class="space-y-4">
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
          <button onclick="bookCat='';render()" class="chip ${!bookCat ? 'chip-on' : 'chip-off'} chip-sm">All</button>
          ${cats.map(c => `<button onclick="bookCat='${c}';render()" class="chip ${bookCat === c ? 'chip-on' : 'chip-off'} chip-sm">${c}</button>`).join('')}
        </div>
        <div class="space-y-3">
          ${services.filter(s => !bookCat || s.category === bookCat).map(s => {
            const p = getUser(s.practitioner);
            const isLast = lastAppt && s.practitioner === lastAppt.practitioner;
            return `<button onclick="selectService('${s.id}')" class="w-full card p-5 text-left hover:border-sage-400 transition group ${isLast ? 'ring-1 ring-sage-500/30' : ''}">
              <div class="flex items-start gap-3">
                ${avatar(p, 48)}
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <div class="font-display font-semibold">${esc(s.name)}</div>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-sage-500/15 text-sage-700 dark:text-sage-300 font-semibold">${esc(s.category)}</span>
                    ${isLast ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-sage-500 text-white font-semibold">Last practitioner</span>` : ''}
                  </div>
                  <div class="text-xs muted mt-0.5">with <span class="font-medium">${esc(p.name)}</span> ${p.verified ? icon('badge-check', 11, 'inline text-sage-600') : ''}</div>
                  <p class="text-sm muted mt-2 leading-relaxed">${esc(s.description)}</p>
                  <div class="mt-3 flex flex-wrap items-center gap-3 text-xs muted">
                    <span class="flex items-center gap-1">${icon('clock', 12)} ${s.duration} min</span>
                    <span class="flex items-center gap-1">${icon('map-pin', 12)} ${esc(p.location.split(',')[0])}</span>
                    <span class="flex items-center gap-1">${icon('star', 12, 'text-amber-500 fill-amber-500')} ${p.rating}</span>
                  </div>
                </div>
                <div class="text-right shrink-0">
                  <div class="font-display font-bold text-lg">${fmtMoney(s.price)}</div>
                  <div class="text-[11px] muted mt-1 flex items-center gap-1 justify-end">Choose ${icon('arrow-right', 11)}</div>
                </div>
              </div>
            </button>`;
          }).join('')}
        </div>
      </div>
      <div class="hidden lg:block">${BookingSummaryPanel()}</div>
    </div>
  </div>`;
}
function quickRebook() {
  const a = getClientLastAppt();
  if (!a) return;
  bookState = { practitioner: a.practitioner, service: a.service, areas: [...(a.areas || [])], date: null, time: null, fromLast: true };
  bookStep = 1;
  render();
  toast('Loaded from your last session');
}

/* STEP 2 — When & where with focus-areas callout */
function BookStep2() {
  const p = getUser(bookState.practitioner);
  const s = getService(bookState.service);
  const selectedDate = bookState.date ? new Date(bookState.date) : null;
  const today = new Date();
  const maxDate = addDays(today, 60);
  const viewYear = selectedDate ? selectedDate.getFullYear() : today.getFullYear();
  const viewMonth = selectedDate ? selectedDate.getMonth() : today.getMonth();
  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const lastOfMonth = new Date(viewYear, viewMonth + 1, 0);
  const gridStart = startOfWeek(firstOfMonth);
  const gridEnd = addDays(startOfWeek(lastOfMonth), 6);
  const gridDays = [];
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) gridDays.push(new Date(d));

  const slots = selectedDate ? generateSlots(selectedDate) : [];
  const morning = slots.filter(x => x.time.includes('AM'));
  const afternoon = slots.filter(x => x.time.includes('PM'));

  let nextAvail = null;
  for (let i = 0; i < 30 && !nextAvail; i++) {
    const d = addDays(today, i + 1);
    if (d.getDay() === 0) continue;
    const daySlots = generateSlots(d);
    const first = daySlots.find(x => x.available);
    if (first) nextAvail = { date: d, time: first.time };
  }

  const areas = bookState.areas || [];
  // Practitioner's last session with this client, for area suggestions
  const lastWithSame = State.user ? APPOINTMENTS
    .filter(a => a.client === State.user.id && a.practitioner === p.id && a.status !== 'cancelled')
    .sort((a, b) => new Date(b.start) - new Date(a.start))[0] : null;
  const lastAreas = lastWithSame ? (lastWithSame.areas || []).map(x => getArea(x)?.label).filter(Boolean) : [];

  const slotGroup = (title, iconName, list) => list.length === 0 ? '' : `
    <div class="mb-4">
      <div class="flex items-center gap-2 mb-2">
        <div class="w-6 h-6 rounded-lg bg-[rgb(var(--surface-2))] grid place-items-center muted">${icon(iconName, 12)}</div>
        <div class="text-xs font-bold uppercase tracking-wider">${title}</div>
        <div class="text-[11px] muted">${list.filter(x => x.available).length} open</div>
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
        ${list.map(sl => `<button onclick="${sl.available ? `bookState.time='${sl.time}';render()` : `openWaitlist()`}"
          class="time-slot !py-2.5 !px-3 ${bookState.time === sl.time ? 'selected' : ''} ${!sl.available ? 'disabled' : ''}"
          ${!sl.available ? 'title="Join the waitlist"' : ''}>
          <div class="flex items-center gap-1.5"><span class="font-semibold text-xs">${sl.time}</span></div>
          <div class="slot-meta text-[10px] muted">${sl.available ? `${s.duration}m` : 'Full'}</div>
        </button>`).join('')}
      </div>
    </div>`;

  return `
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    ${BookingHeader(2, 3, 'When works for you?', 'Choose a date and time. Add focus areas to help your practitioner prepare. All times shown in Philippine Standard Time (PST, GMT+8).')}
    <div class="grid lg:grid-cols-[1fr_300px] gap-5">
      <div class="space-y-4">
        <div class="card p-4 flex items-center gap-3">
          ${avatar(p, 44)}
          <div class="min-w-0 flex-1">
            <div class="text-xs muted mb-0.5">Booking with</div>
            <div class="font-semibold text-sm truncate">${esc(p.name)}</div>
            <div class="text-xs muted truncate">${esc(s.name)} · ${s.duration} min · ${fmtMoney(s.price)}</div>
          </div>
          <button onclick="bookStep=0;render()" class="text-xs text-sage-600 font-semibold hover:underline">Change</button>
        </div>

        ${nextAvail ? `
          <button onclick="bookState.date='${nextAvail.date.toISOString()}';bookState.time='${nextAvail.time}';render()" class="w-full card p-4 text-left hover:border-sage-400 transition border-l-4 !border-l-sage-500">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-sage-500 text-white grid place-items-center shrink-0">${icon('zap', 18)}</div>
              <div class="flex-1 min-w-0">
                <div class="text-xs font-bold tracking-widest uppercase text-sage-600">Next available</div>
                <div class="font-semibold text-sm mt-0.5">${fmtDate(nextAvail.date, {weekday:'long', month:'short', day:'numeric'})} at ${nextAvail.time}</div>
              </div>
              ${icon('arrow-right', 16, 'muted')}
            </div>
          </button>
        ` : ''}

        <!-- Focus-areas callout — emphasized, not hidden -->
        <div class="card p-4 focus-callout-ring">
          <div class="flex items-start gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl bg-sage-500 text-white grid place-items-center shrink-0">${icon('sparkles', 18)}</div>
            <div class="flex-1 min-w-0">
              <div class="font-display font-semibold text-sm flex items-center gap-2 flex-wrap">
                Which areas need attention?
                <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-sage-500/15 text-sage-700 dark:text-sage-300 font-semibold uppercase tracking-wider">Optional</span>
              </div>
              <div class="text-xs muted mt-0.5">Your practitioner will see this before your session so they can prepare.</div>
              ${areas.length ? `<div class="text-xs font-semibold text-sage-600 mt-2">${areas.length} area${areas.length>1?'s':''} selected</div>` : ''}
            </div>
          </div>

          ${lastAreas.length && !areas.length ? `
            <div class="mb-3 p-3 rounded-xl surface-2">
              <div class="text-xs muted mb-2">From your last session with ${esc(p.first)}:</div>
              <div class="flex flex-wrap gap-1.5 mb-2">
                ${lastAreas.map(x => `<span class="text-[10px] px-2 py-0.5 rounded-full bg-sage-500/15 text-sage-700 dark:text-sage-300">${x}</span>`).join('')}
              </div>
              <button onclick="applyLastAreas()" class="text-xs text-sage-600 font-semibold hover:underline flex items-center gap-1">${icon('rotate-ccw', 12)} Use these again</button>
            </div>
          ` : ''}

          <div class="flex flex-wrap gap-2 mb-3">
            ${BODY_PACKS.map(pk => `<button onclick="applyPack('${pk.id}')" class="chip chip-off chip-sm !gap-1.5">${icon(pk.icon, 12)} ${pk.label}</button>`).join('')}
            ${areas.length ? `<button onclick="bookState.areas=[];render()" class="chip chip-off chip-sm">${icon('x', 12)} Clear</button>` : ''}
          </div>

          <details ${areas.length ? 'open' : ''} class="group">
            <summary class="cursor-pointer list-none flex items-center justify-between gap-3 py-2">
              <span class="text-xs font-semibold text-sage-600">${areas.length ? 'Edit selected areas' : 'Tap body map or list to add areas'}</span>
              ${icon('chevron-down', 14, 'muted group-open:rotate-180 transition-transform')}
            </summary>
            <div class="mt-3">
              <div class="grid sm:grid-cols-2 gap-3">
                <div class="surface-2 rounded-2xl p-3">${BodyMapSVG(areas)}</div>
                <div class="max-h-[340px] overflow-y-auto pr-1 space-y-1.5">
                  ${BODY_AREAS.map(a => {
                    const on = areas.includes(a.id);
                    return `<button onclick="toggleArea('${a.id}')" class="w-full flex items-start gap-3 p-3 rounded-xl text-left transition ${on?'bg-sage-500/15 border border-sage-500/40':'surface-2 hover:bg-sage-500/5 border border-transparent'}">
                      <div class="w-5 h-5 rounded-md border-2 shrink-0 mt-0.5 grid place-items-center ${on?'bg-sage-500 border-sage-500':'border-[rgb(var(--border))]'}">${on?icon('check', 11, 'text-white'):''}</div>
                      <div class="flex-1 min-w-0"><div class="text-sm font-medium">${esc(a.label)}</div><div class="text-xs muted">${esc(a.hint)}</div></div>
                    </button>`;
                  }).join('')}
                </div>
              </div>
            </div>
          </details>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div class="card p-4">
            <div class="flex items-center justify-between mb-4">
              <button onclick="shiftBookMonth(-1)" class="w-9 h-9 rounded-full grid place-items-center hover:bg-black/5 dark:hover:bg-white/5" aria-label="Previous month">${icon('chevron-left', 16)}</button>
              <div class="font-display font-semibold">${firstOfMonth.toLocaleDateString('en-US', {month:'long', year:'numeric'})}</div>
              <button onclick="shiftBookMonth(1)" class="w-9 h-9 rounded-full grid place-items-center hover:bg-black/5 dark:hover:bg-white/5" aria-label="Next month">${icon('chevron-right', 16)}</button>
            </div>
            <div class="cal-grid text-[11px] uppercase tracking-wider muted font-bold mb-2">
              ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="text-center">${d[0]}</div>`).join('')}
            </div>
            <div class="cal-grid">
              ${gridDays.map(d => {
                const inMonth = d.getMonth() === viewMonth;
                const inRange = d >= new Date(today.getFullYear(), today.getMonth(), today.getDate()) && d <= maxDate;
                const isSelected = selectedDate && sameDay(d, selectedDate);
                const isSunday = d.getDay() === 0;
                const disabled = !inMonth || !inRange || isSunday;
                const hasAvail = !disabled;
                return `<button onclick="${disabled ? '' : `bookState.date='${d.toISOString()}';bookState.time=null;render()`}" class="cal-day ${isSelected ? 'selected' : ''} ${isToday(d) ? 'today' : ''} ${disabled ? 'disabled' : ''}" ${disabled ? 'disabled' : ''}>
                  <span>${d.getDate()}</span>
                  ${hasAvail && !isSelected ? '<span class="avail-dot"></span>' : ''}
                  ${isSelected ? '<span class="avail-dot" style="background:white"></span>' : ''}
                </button>`;
              }).join('')}
            </div>
          </div>

          <div class="card p-4">
            ${!selectedDate ? `<div class="py-12 text-center"><div class="w-14 h-14 rounded-2xl bg-sage-500/10 text-sage-600 grid place-items-center mx-auto mb-4">${icon('calendar-days', 26)}</div><div class="font-semibold text-sm">Select a date</div><div class="text-xs muted mt-1 max-w-xs mx-auto">Open time slots for that day will appear here.</div></div>`
            : slots.length === 0 ? `<div class="py-12 text-center"><div class="w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-600 grid place-items-center mx-auto mb-4">${icon('calendar-x', 26)}</div><div class="font-semibold text-sm">Closed this day</div><div class="text-xs muted mt-1 max-w-xs mx-auto">Please pick another date.</div></div>`
            : `
              <div class="flex items-center justify-between mb-3">
                <div class="font-display font-semibold text-sm">${fmtDate(selectedDate, {weekday:'long', month:'short', day:'numeric'})}</div>
                <button onclick="bookState.date=null;bookState.time=null;render()" class="text-xs text-sage-600 font-semibold hover:underline">Change</button>
              </div>
              <div class="max-h-[360px] overflow-y-auto pr-1">
                ${slotGroup('Morning', 'sunrise', morning)}
                ${slotGroup('Afternoon', 'sun', afternoon)}
              </div>
            `}
          </div>
        </div>
      </div>
      <div class="hidden lg:block">${BookingSummaryPanel()}</div>
    </div>

    <div class="flex flex-col sm:flex-row gap-2 mt-6 lg:max-w-[calc(100%-320px)]">
      <button onclick="bookStep=0;render()" class="btn btn-outline">${icon('arrow-left', 14)} Back</button>
      <button ${bookState.date && bookState.time ? '' : 'disabled'} onclick="bookStep=2;render()" class="btn btn-primary flex-1">Review booking ${icon('arrow-right', 14)}</button>
    </div>
  </div>`;
}
function applyLastAreas() {
  const p = bookState.practitioner ? getUser(bookState.practitioner) : null;
  if (!p || !State.user) return;
  const last = APPOINTMENTS
    .filter(a => a.client === State.user.id && a.practitioner === p.id && a.status !== 'cancelled')
    .sort((a, b) => new Date(b.start) - new Date(a.start))[0];
  if (last) {
    bookState.areas = [...(last.areas || [])];
    render();
    toast('Loaded from your last session');
  }
}
function generateSlots(date) {
  const wd = date.getDay();
  if (wd === 0) return [];
  const base = wd === 6
    ? [['10:00 AM', true], ['11:00 AM', false], ['12:00 PM', true], ['1:00 PM', true]]
    : [['9:00 AM', true], ['9:30 AM', false], ['10:00 AM', true], ['10:30 AM', true], ['11:00 AM', false], ['11:30 AM', true], ['1:00 PM', true], ['1:30 PM', true], ['2:00 PM', false], ['2:30 PM', true], ['3:00 PM', true], ['3:30 PM', false]];
  return base.map(([t, avail]) => ({ time: t, available: avail }));
}
function shiftBookMonth(delta) {
  const d = bookState.date ? new Date(bookState.date) : new Date();
  d.setMonth(d.getMonth() + delta);
  bookState.date = d.toISOString();
  render();
}
function openWaitlist() {
  const p = bookState.practitioner ? getUser(bookState.practitioner) : null;
  const s = bookState.service ? getService(bookState.service) : null;
  const d = bookState.date ? new Date(bookState.date) : new Date();

function confirmBooking() {
  const p = getUser(bookState.practitioner);
  const s = getService(bookState.service);
  const d = bookState.date ? new Date(bookState.date) : new Date();
  const [time, ampm] = bookState.time.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  d.setHours(h, m, 0, 0);
  const ref = 'TB-' + new Date().getFullYear().toString().slice(2) + '01-' + Math.floor(1000 + Math.random()*9000);
  APPOINTMENTS.push({
    id: 'ap' + Date.now(),
    client: State.user.id,
    practitioner: p.id,
    service: s.id,
    start: d,
    duration: s.duration,
    status: 'pending',
    mode: p.consultation,
    location: p.location,
    areas: [...(bookState.areas || [])],
    ref,
  });
  bookState.ref = ref;
  bookStep = 3;
  toast('Appointment booked!');
  render();
  window.scrollTo({top:0});
}

let notifFilter = 'all';
function PageNotifications() {
  let list = [...NOTIFICATIONS];
  if (notifFilter === 'unread') list = list.filter(n => !n.read);
  else if (notifFilter === 'appointments') list = list.filter(n => n.type === 'appointment');
  else if (notifFilter === 'messages') list = list.filter(n => n.type === 'message');
  else if (notifFilter === 'billing') list = list.filter(n => n.type === 'payment' || n.type === 'invoice');

  const card = (n) => {
    const ic = { appointment:'calendar-check', message:'message-circle', payment:'wallet', review:'star', invoice:'receipt', system:'info' }[n.type] || 'bell';
    return `<div class="card p-4 flex items-start gap-3 ${!n.read?'!border-sage-400/40':''}">
      <div class="w-10 h-10 rounded-2xl bg-sage-500/15 text-sage-600 grid place-items-center shrink-0">${icon(ic, 16)}</div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-sm">${esc(n.title)}</div>
        <div class="text-sm muted mt-0.5">${esc(n.body)}</div>
        ${n.action ? `<div class="flex flex-wrap gap-2 mt-3">
          <button onclick="handleNotification('${n.id}','${n.action}')" class="btn btn-sm btn-primary !min-h-[32px] !py-0 !px-3 !text-xs">${esc(n.actionLabel)}</button>
          <button onclick="dismissNotification('${n.id}')" class="btn btn-sm btn-ghost !min-h-[32px] !py-0 !px-3 !text-xs">Dismiss</button>
        </div>` : ''}
      </div>
      <div class="text-xs muted whitespace-nowrap">${relTime(n.at)}</div>
    </div>`;
  };

  return `
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-5 sm:py-6">
    <div class="flex items-center justify-between mb-5 gap-3">
      <div><h1 class="font-display font-bold text-2xl tracking-tight">Notifications</h1><div class="text-sm muted mt-0.5">${NOTIFICATIONS.filter(n=>!n.read).length} new</div></div>
      <button onclick="NOTIFICATIONS.forEach(n=>n.read=true);toast('All marked as read');render()" class="btn btn-sm btn-outline">Mark all read</button>
    </div>

    <div class="flex gap-1.5 overflow-x-auto pb-3 mb-3 no-scrollbar">
      ${[['all','All'],['unread','Unread'],['appointments','Appointments'],['messages','Messages'],['billing','Billing']].map(([k,l]) => `<button onclick="notifFilter='${k}';render()" class="chip ${notifFilter===k?'chip-on':'chip-off'} chip-sm">${l}</button>`).join('')}
    </div>

    ${list.length === 0
      ? EmptyState({ icon:'bell-off', title:'You\'re all caught up', description:'New notifications will appear here.' })
      : groupByDate(list, n => n.at, { render: card, itemLabel:'notification', order:['today','tomorrow','thisWeek','later','past'] })}
  </div>`;
}
function handleNotification(id, action) {
  const n = NOTIFICATIONS.find(x => x.id === id);
  if (n) n.read = true;
  const messages = { view:'Opening…', reply:'Opening conversation…', confirm:'Confirmed', remind:'Reminder sent' };
  toast(messages[action] || 'Done');
  if (n?.link) navigate(n.link.replace('#',''));
  else render();
}
function dismissNotification(id) {
  const i = NOTIFICATIONS.findIndex(x => x.id === id);
  if (i >= 0) NOTIFICATIONS.splice(i, 1);
  render();
}

   ============================================================ */
function render() {
  const root = $('#root');
  const { path, parts } = getRoute();

  if (!path || path === '') root.innerHTML = Landing();
  else if (path === 'login') root.innerHTML = LoginPage();
  else if (path === 'register') root.innerHTML = RegisterPage();
  else if (path === 'forgot') root.innerHTML = ForgotPage();
  else if (path === 'help') root.innerHTML = PageHelp();
  else if (path === 'terms') root.innerHTML = PageTerms();
  else if (path === 'privacy-policy') root.innerHTML = PagePrivacyPolicy();
  else if (path === 'cancellation') root.innerHTML = PageCancellation();
  else if (path.startsWith('onboard/')) root.innerHTML = OnboardingPage(path.includes('practitioner') ? 'practitioner' : 'client');
  else if (!State.user) root.innerHTML = LoginPage();
  else if (path.startsWith('app/') || path.startsWith('admin')) {
    let page = '';
    const sub = parts.slice(1);
    if (path.startsWith('admin')) {
      const a = parts.slice(1);
      if (a.length === 0) page = PageAdminDashboard();
      else if (a[0] === 'users') page = PageAdminUsers();
      else if (a[0] === 'announcements') page = PageAdminAnnouncements();
      else if (a[0] === 'audit') page = PageAdminAudit();
      else page = PageAdminDashboard();
    } else {
      const u = State.user;
      if (sub.length === 0 || sub[0] === 'dashboard') page = PageDashboard();
      else if (sub[0] === 'calendar' && u.role === 'practitioner') page = PageCalendar();
      else if (sub[0] === 'appointments') page = sub[1] ? PageAppointmentDetail(sub[1]) : PageAppointments();
      else if (sub[0] === 'clients' && u.role !== 'client') page = sub[1] ? PageClientDetail(sub[1]) : PageClients();
      else if (sub[0] === 'services' && u.role === 'practitioner') page = PageServices();
      else if (sub[0] === 'notes' && u.role === 'practitioner') page = PageNotes();
      else if (sub[0] === 'messages') page = PageMessages(sub[1]);
      else if (sub[0] === 'invoices') page = PageInvoices();
      else if (sub[0] === 'reports' && u.role === 'practitioner') page = PageAnalytics();
      else if (sub[0] === 'availability' && u.role === 'practitioner') page = PageAvailability();
      else if (sub[0] === 'notifications') page = PageNotifications();
      else if (sub[0] === 'settings') page = PageSettings();
      else if (sub[0] === 'verification' && u.role === 'practitioner') page = PageVerification();
      else if (sub[0] === 'documents' && u.role === 'client') page = PageDocuments();
      else if (sub[0] === 'profile' && u.role === 'client') page = PageClientProfileSelf();
      else if (sub[0] === 'book' && u.role === 'client') page = PageBook();
      else page = Page404();
    }
    root.innerHTML = AppShell(page);
  }
  else root.innerHTML = Page404();

  iconEl();
  renderThemeToggle();

  $$('.body-zone').forEach(z => {
    z.addEventListener('click', () => {
      const zone = z.dataset.zone;
      if (zone === 'chest' || zone === 'upper-back') toggleArea('upper-back');
      else toggleArea(zone);
    });
  });
}

window.addEventListener('hashchange', () => {
  // Show a brief skeleton when navigating within the app
  const path = getRoute().path;
  if (State.user && (path.startsWith('app/') || path.startsWith('admin'))) {
    showRouteSkeleton();
  }
  render();
  window.scrollTo({top:0});
});
applyTheme();
render();
</script>
</body>
</html>
